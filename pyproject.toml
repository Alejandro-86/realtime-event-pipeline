[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtime-event-pipeline"
version = "0.1.0"
description = "Production Kafka event pipeline — typed schemas, dead-letter queue, Prometheus monitoring"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_pipeline"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
